# Tunix PPO (actor + learned critic, GAE) on POLARIS-53K with vLLM (tpu-inference) rollouts. Overrides tunix/cli/base_config.yaml.
# Same prompt (tools/polaris_data.py) and reward (tools/math_reward.py) as the SkyRL runs.
# Model, mesh, batch, lengths, LoRA vs full fine-tuning and paths are set by scripts/tunix/grpo_math.sh.
model_config:
  model_source: "huggingface"
  use_flash_attention: true
  flash_attention_block_size: 256
  remat_config: 3
  rng_seed: 42
actor_model_config:
  mesh:
    shape: "(1,4)"
    axis_names: "('fsdp','tp')"
reference_model_config:
  mesh: null
  same_mesh_as: "actor"
critic_model_config:       # same backbone + scalar value head (TransformerWithScoreHead); the launcher gives it
  mesh: null               # a LoRA adapter when MODE=lora (full fine-tuning otherwise)
  same_mesh_as: "actor"
rollout_model_config:      # colocated: vLLM shares the trainer's chips (vllm_config.hbm_utilization splits HBM)
  mesh: null
  same_mesh_as: "actor"
tokenizer_config:
  tokenizer_type: "huggingface"
  add_bos: False
data_module: "polaris_data"   # tools/polaris_data.py (tools/ is on sys.path via tools/tunix_run.py)
apply_chat_template_to_dataset: false
batch_size: 16
num_test_batches: 0
num_train_epochs: 1
rl_training_config:
  actor_optimizer_config:
    opt_type: "adamw"
    peak_value: 3e-6
    schedule_type: "warmup_cosine_decay_schedule"
    init_value: 0.0
    end_value: 0.0
    warmup_ratio: 0.1
    warmup_steps: 1
    decay_steps: 10
    b1: 0.9
    b2: 0.99
    weight_decay: 0.1
    max_grad_norm: 0.1
  critic_optimizer_config:
    opt_type: "adamw"
    peak_value: 1e-5
    schedule_type: "warmup_cosine_decay_schedule"
    init_value: 0.0
    end_value: 0.0
    warmup_ratio: 0.1
    warmup_steps: 1
    decay_steps: 10
    b1: 0.9
    b2: 0.99
    weight_decay: 0.1
    max_grad_norm: 0.1
  eval_every_n_steps: 1000
  mini_batch_size: 16          # prompts per policy update (one update per step)
  train_micro_batch_size: 4
  metrics_logging_options:
    project_name: "llm-gcrl"
    flush_every_n_steps: 1
  checkpointing_options:
    save_interval_steps: 1000
    max_to_keep: 1
  profiler_options: {}
rollout_config:
  temperature: 1.0
  top_p: 1.0
  top_k: null
rollout_engine: "vllm"
vllm_config:
  hbm_utilization: 0.4
  async_scheduling: true
  kwargs:   # Tunix CLI default; prefix caching is set by the launcher (PREFIX_CACHE, default on)
    kv_cache_metrics: true
    disable_log_stats: false
    enable_prefix_caching: true
offload_to_cpu: false
# Modern PPO-clip, no KL: one optimizer step per rollout batch (mini_batch = batch), clip-higher 0.2 / 0.28.
# Rollouts per prompt come from PPO_GROUP (tools/tunix_run.py patches Tunix's PPO, which hard-codes 1).
ppo_config:
  num_iterations: 1
  gamma: 1.0
  gae_lambda: 1.0          # Open-Reasoner-Zero: gamma = lambda = 1 (Monte-Carlo returns minus the value baseline)
  beta: 0.0
  epsilon: 0.2
  epsilon_low: 0.2
  epsilon_high: 0.28
  clip_range_value: 0.2
  entropy_coef: 0.0
reward_functions: []   # set by scripts/tunix/grpo_math.sh ($REPO/tools/math_reward.py)
